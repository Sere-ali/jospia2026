# Réglages de charge (prefork) : réponses rapides, workers libérés vite
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 2
Timeout 60
ServerTokens Prod
ServerSignature Off
<IfModule mpm_prefork_module>
    StartServers 8
    MinSpareServers 8
    MaxSpareServers 24
    ServerLimit 120
    MaxRequestWorkers 120
    MaxConnectionsPerChild 2000
</IfModule>
