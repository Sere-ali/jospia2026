output_buffering=On
display_errors=Off
log_errors=On
expose_php=Off
memory_limit=128M
upload_max_filesize=8M
post_max_size=10M
opcache.enable=1
opcache.memory_consumption=96
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=4000
opcache.validate_timestamps=0
opcache.jit=off
realpath_cache_size=1M
realpath_cache_ttl=600
